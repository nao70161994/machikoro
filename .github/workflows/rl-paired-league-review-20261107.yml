name: RL Paired League Statistical Review
on:
  push:
    branches: [feature/rl-paired-league-review-20261107]
    paths: ['.github/workflows/rl-paired-league-review-20261107.yml']
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with: {node-version: '20', cache: npm}
      - run: npm ci
      - name: Verify paired-statistics regression
        run: node tests/review-rl-paired-league.test.js
      - name: Restore all 13 actual league match results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: '42310329077'
          pattern: 'rl-league-match-*-42310329077'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: artifacts/rl-league/raw
      - name: Audit seat symmetry and bootstrap verdicts
        run: |
          node scripts/review-rl-paired-league.js artifacts/rl-league/raw artifacts/rl-league/paired-review
          cat artifacts/rl-league/paired-review.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve JSON and Markdown decisions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rl-paired-league-statistical-review-${{ github.run_id }}
          path: |
            artifacts/rl-league/paired-review.json
            artifacts/rl-league/paired-review.md
          retention-days: 30
