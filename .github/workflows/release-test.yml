name: Release pseudo E2E

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_online_delivery:
        description: 'Validate read-only production delivery'
        required: true
        type: boolean
        default: false

jobs:
  release-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NTFY_CI_TOPIC: ${{ secrets.NTFY_CI_TOPIC }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: scripts/rl/requirements.txt

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install -r scripts/rl/requirements.txt

      - name: Static safety gate
        run: npm run test:static

      - name: Unit test gate
        run: npm test

      - name: PWA test gate
        run: npm run test:pwa

      - name: Release pseudo E2E gate
        run: npm run test:release

      - name: Notify CI failure
        if: ${{ failure() && env.NTFY_CI_TOPIC != '' }}
        continue-on-error: true
        env:
          FAILED_JOB: release-test
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          COMMIT="${GITHUB_SHA}"
          SHORT_COMMIT="${COMMIT:0:7}"
          cat > /tmp/ntfy-ci-message.txt << EOF_NTFY
          workflow=${GITHUB_WORKFLOW}
          branch=${GITHUB_REF_NAME}
          commit=${SHORT_COMMIT}
          failed_job=${FAILED_JOB}
          run=${RUN_URL}
          EOF_NTFY
          curl -fsS -X POST "https://ntfy.sh/${NTFY_CI_TOPIC}" \
            -H "Title: [ダイスシティ CI] ${GITHUB_WORKFLOW} failed" \
            -H "Priority: 4" \
            -H "Tags: warning,github_actions" \
            --data-binary @/tmp/ntfy-ci-message.txt

  validate-online-delivery:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_online_delivery }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: production-online-delivery
      cancel-in-progress: false
    env:
      PRODUCTION_ORIGIN: https://machikoro-9jv2.onrender.com
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:online-delivery -- --origin "$PRODUCTION_ORIGIN" --timeout-ms 30000
      - run: node tests/online-delivery-handshake.js --origin "$PRODUCTION_ORIGIN" --timeout-ms 30000
