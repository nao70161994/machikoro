name: Release pseudo E2E

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NTFY_CI_TOPIC: ${{ secrets.NTFY_CI_TOPIC }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/rl/requirements-ci.txt

      - name: Install dependencies
        run: |
          npm ci
          pip install -r scripts/rl/requirements-ci.txt

      - name: Static safety gate
        run: npm run test:static

      - name: Unit test gate
        run: npm test

      - name: PWA test gate
        run: npm run test:pwa

      - name: Online sync and reconnect E2E gate
        run: npm run test:online

      - name: Release pseudo E2E gate
        run: npm run test:release

      - name: Notify CI failure
        if: ${{ failure() && env.NTFY_CI_TOPIC != '' }}
        continue-on-error: true
        env:
          FAILED_JOB: release-test
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          COMMIT="${GITHUB_SHA}"
          SHORT_COMMIT="${COMMIT:0:7}"
          cat > /tmp/ntfy-ci-message.txt << EOF_NTFY
          workflow=${GITHUB_WORKFLOW}
          branch=${GITHUB_REF_NAME}
          commit=${SHORT_COMMIT}
          failed_job=${FAILED_JOB}
          run=${RUN_URL}
          EOF_NTFY
          curl -fsS -X POST "https://ntfy.sh/${NTFY_CI_TOPIC}" \
            -H "Title: [ダイスシティ CI] ${GITHUB_WORKFLOW} failed" \
            -H "Priority: 4" \
            -H "Tags: warning,github_actions" \
            --data-binary @/tmp/ntfy-ci-message.txt

  mobile-webkit:
    runs-on: ubuntu-latest
    # Serialized WebKit tests took 34m; leave time to upload failure evidence.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install WebKit runtime
        run: npx playwright install --with-deps webkit
      - name: Mobile WebKit E2E
        # Four-client online tests share this runner with the visual suites.
        # Serialize browsers so CPU contention does not consume test deadlines.
        # Theme screenshots run in the path-filtered visual workflow. Nightly
        # still runs the complete browser suite through test:browser-e2e.
        run: npm run test:browser-release -- --workers=1
      - name: Upload WebKit visual review and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-mobile-webkit-review
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  cpu-difficulty-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: CPU difficulty paired smoke
        run: npm run test:cpu-difficulty-smoke
      - name: Upload CPU difficulty smoke artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpu-difficulty-smoke
          path: artifacts/cpu-difficulty-smoke.json
          if-no-files-found: error
