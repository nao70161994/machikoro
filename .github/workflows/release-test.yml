name: Release pseudo E2E

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: scripts/rl/requirements.txt

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install -r scripts/rl/requirements.txt

      - name: Static safety gate
        run: npm run test:static

      - name: Unit test gate
        run: npm test

      - name: PWA test gate
        run: npm run test:pwa

      - name: Release pseudo E2E gate
        run: npm run test:release
