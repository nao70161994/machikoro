name: Release pseudo E2E

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NTFY_CI_TOPIC: ${{ secrets.NTFY_CI_TOPIC }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: scripts/rl/requirements.txt

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install -r scripts/rl/requirements.txt

      - name: Static safety gate
        run: npm run test:static

      - name: Unit test gate
        run: npm test

      - name: PWA test gate
        run: npm run test:pwa

      - name: Online sync and reconnect E2E gate
        run: npm run test:online

      - name: Release pseudo E2E gate
        run: npm run test:release

      - name: Notify CI failure
        if: ${{ failure() && env.NTFY_CI_TOPIC != '' }}
        continue-on-error: true
        env:
          FAILED_JOB: release-test
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          COMMIT="${GITHUB_SHA}"
          SHORT_COMMIT="${COMMIT:0:7}"
          cat > /tmp/ntfy-ci-message.txt << EOF_NTFY
          workflow=${GITHUB_WORKFLOW}
          branch=${GITHUB_REF_NAME}
          commit=${SHORT_COMMIT}
          failed_job=${FAILED_JOB}
          run=${RUN_URL}
          EOF_NTFY
          curl -fsS -X POST "https://ntfy.sh/${NTFY_CI_TOPIC}" \
            -H "Title: [ダイスシティ CI] ${GITHUB_WORKFLOW} failed" \
            -H "Priority: 4" \
            -H "Tags: warning,github_actions" \
            --data-binary @/tmp/ntfy-ci-message.txt

  mobile-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install WebKit runtime
        run: npx playwright install --with-deps webkit
      - name: Mobile WebKit E2E
        run: npm run test:browser-e2e
      - name: Upload WebKit diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-mobile-webkit-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
