name: Release pseudo E2E

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit test gate
        run: npm test

      - name: Release pseudo E2E gate
        run: npm run test:release
