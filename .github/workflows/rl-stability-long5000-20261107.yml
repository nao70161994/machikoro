name: RL Stability 5000-Game Controlled Replication
on:
  push:
    branches: [research/rl-stability-long5000-20261107]
    paths: ['.github/workflows/rl-stability-long5000-20261107.yml']
permissions:
  contents: read
  actions: read
jobs:
  train:
    name: seed ${{ matrix.seed }} / ${{ matrix.variant }} (5000)
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {seed: 81, variant: reference, rate: '0.00002'}
          - {seed: 81, variant: half-lr, rate: '0.00001'}
          - {seed: 82, variant: reference, rate: '0.00002'}
          - {seed: 82, variant: half-lr, rate: '0.00001'}
    env:
      SEED: ${{ matrix.seed }}
      VARIANT: ${{ matrix.variant }}
      RATE: ${{ matrix.rate }}
      LABEL: stability5000-seed${{ matrix.seed }}-${{ matrix.variant }}-${{ github.run_id }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with: {node-version: '20', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/rl/requirements-ci.txt
      - run: |
          npm ci
          python -m pip install -r scripts/rl/requirements-ci.txt
      - name: Five thousand independent self-play games with fixed win objective
        shell: bash
        run: |
          set -euo pipefail
          dir="models/rl_model/runs/$LABEL"
          mkdir -p "$dir"
          printf 'objective=terminal-win-and-asset\ngames=5000\nlr=%s\nseed=%s\nepsilon_initial=0.20\ntrain_opponents=self=1\nwarm_start=none\n' "$RATE" "$SEED" > "$dir/experiment.txt"
          timeout --signal=TERM --kill-after=45s 250m \
            sh scripts/rl/run-self-only-h256-lr2e5-5000.sh \
              --run-label "$LABEL" --seed "$SEED" \
              --games 5000 --lr "$RATE" --epsilon 0.20 \
              --hidden 256 --train-opponents self=1 --self-learn-both-sides \
              --eval-every 250 --checkpoint-every 50 --progress-every 100 \
              --best-checkpoint-top-k 3 --restore-best-at-end \
              --js-eval-games 4 --initial-eval-games 0 \
              --eval-random-games 4 --eval-heuristic-games 2 --eval-pool-games 0 \
              --final-eval-random-games 8 --final-eval-heuristic-games 4 --final-eval-pool-games 0 \
              --pool-update-every 0 --max-steps 1200 --eval-max-steps 1200 \
              > "$dir/train.log" 2>&1
          tail -n 18 "$dir/train.log"
      - name: Heldout best versus last and same CPU opponents
        shell: bash
        timeout-minutes: 70
        run: |
          set -euo pipefail
          dir="models/rl_model/runs/$LABEL"
          test -s "$dir/best_model.browser.json"
          test -s "$dir/model.progress.browser.json"
          node scripts/eval-rl-head-to-head.js \
            --candidate "$dir/best_model.browser.json" \
            --baseline "$dir/model.progress.browser.json" \
            --games 240 --seed 20261130 --max-steps 1500 \
            --bootstrap-iterations 600 --format json \
            --output "$dir/best-vs-last.json" --abort-on-exhaustion
          node scripts/eval-rl-models.js \
            --model-paths "$dir/best_model.browser.json,$dir/model.progress.browser.json" \
            --games 150 --seed 20261201 --max-steps 1500 \
            --paired-seats --opponents weak,normal,strong,expert \
            --format json --output "$dir/heldout-evaluation.json"
      - name: Preserve checkpoint curves and independent results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stability-5000-${{ matrix.seed }}-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            models/rl_model/runs/stability5000-seed${{ matrix.seed }}-${{ matrix.variant }}-${{ github.run_id }}/experiment.txt
            models/rl_model/runs/stability5000-seed${{ matrix.seed }}-${{ matrix.variant }}-${{ github.run_id }}/train.log
            models/rl_model/runs/stability5000-seed${{ matrix.seed }}-${{ matrix.variant }}-${{ github.run_id }}/train_metrics.csv
            models/rl_model/runs/stability5000-seed${{ matrix.seed }}-${{ matrix.variant }}-${{ github.run_id }}/summary.json
            models/rl_model/runs/stability5000-seed${{ matrix.seed }}-${{ matrix.variant }}-${{ github.run_id }}/best_model*.browser.json
            models/rl_model/runs/stability5000-seed${{ matrix.seed }}-${{ matrix.variant }}-${{ github.run_id }}/model.progress.browser.json
            models/rl_model/runs/stability5000-seed${{ matrix.seed }}-${{ matrix.variant }}-${{ github.run_id }}/best-vs-last.json
            models/rl_model/runs/stability5000-seed${{ matrix.seed }}-${{ matrix.variant }}-${{ github.run_id }}/heldout-evaluation.json
          retention-days: 30
          if-no-files-found: warn
