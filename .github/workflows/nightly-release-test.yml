name: Nightly Release Regression

on:
    schedule:
        # 03:17 JST daily. Keep this away from top-of-hour GitHub Actions load spikes.
        - cron: '17 18 * * *'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    nightly-release-test:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            NTFY_CI_TOPIC: ${{ secrets.NTFY_CI_TOPIC }}

        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
              with:
                  node-version: '20'
                  cache: npm
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
              with:
                  python-version: '3.12'
                  cache: pip
                  cache-dependency-path: scripts/rl/requirements-ci.txt
            - name: Install dependencies
              run: |
                  npm ci
                  pip install -r scripts/rl/requirements-ci.txt
            - name: Release pseudo E2E nightly
              run: npm run test:release
            - name: PWA nightly
              run: npm run test:pwa
            - name: Online restore/sync nightly
              run: npm run test:online
            - name: Notify nightly CI failure
              if: ${{ failure() && env.NTFY_CI_TOPIC != '' }}
              continue-on-error: true
              env:
                  FAILED_JOB: nightly-release-test
              run: |
                  RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                  COMMIT="${GITHUB_SHA}"
                  SHORT_COMMIT="${COMMIT:0:7}"
                  cat > /tmp/ntfy-ci-message.txt << EOF_NTFY
                  workflow=${GITHUB_WORKFLOW}
                  branch=${GITHUB_REF_NAME}
                  commit=${SHORT_COMMIT}
                  failed_job=${FAILED_JOB}
                  run=${RUN_URL}
                  EOF_NTFY
                  curl -fsS -X POST "https://ntfy.sh/${NTFY_CI_TOPIC}" \
                      -H "Title: [ダイスシティ CI] Nightly release regression failed" \
                      -H "Priority: 4" \
                      -H "Tags: warning,github_actions,nightly" \
                      --data-binary @/tmp/ntfy-ci-message.txt

    simulation-test:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
              with:
                  node-version: '20'
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Simulation regression
              run: npm run test:sim
            - name: CPU 2-10 player regression
              run: npm run test:cpu-regression

    online-soak:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
              with:
                  node-version: '20'
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Four-player online soak
              env:
                  MACHIKORO_SOAK_RUNS: '3'
              run: npm run test:soak

    browser-inventory:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
              with:
                  node-version: '20'
                  cache: npm
            - run: npm ci
            - name: Prove complete disjoint Playwright shard inventory
              run: node scripts/nightly-browser-coverage.js plan --shards=6 --output=artifacts/nightly-browser-plan.json
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: nightly-browser-plan
                  path: artifacts/nightly-browser-plan.json
                  if-no-files-found: error

    mobile-webkit-e2e:
        needs: browser-inventory
        runs-on: ubuntu-latest
        timeout-minutes: 35
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4, 5, 6]
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
              with:
                  node-version: '20'
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: nightly-browser-plan
                  path: artifacts
            - name: Install WebKit and Chromium runtime
              run: npx playwright install --with-deps webkit chromium
            - name: Complete browser E2E shard
              # Keep the same projects, retries and test settings as Release.
              # Native sharding preserves file/serial groups; one worker per runner.
              run: npm run test:browser-e2e -- --workers=1 --shard=${{ matrix.shard }}/6 --reporter=line,json,blob
              env:
                  PLAYWRIGHT_JSON_OUTPUT_NAME: artifacts/report-${{ matrix.shard }}.json
                  PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report
            - name: Verify every selected test produced an execution result
              if: ${{ always() && !cancelled() }}
              run: node scripts/nightly-browser-coverage.js verify --plan=artifacts/nightly-browser-plan.json --report=artifacts/report-${{ matrix.shard }}.json --shard=${{ matrix.shard }}
            - name: Upload shard execution report and diagnostics
              if: ${{ always() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: nightly-browser-shard-${{ matrix.shard }}
                  path: |
                      artifacts/report-${{ matrix.shard }}.json
                      blob-report/
                      test-results/
                  if-no-files-found: error

    browser-coverage:
        if: ${{ always() }}
        needs: [browser-inventory, mobile-webkit-e2e]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
              with:
                  node-version: '20'
            - run: npm ci
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: nightly-browser-plan
                  path: artifacts
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: nightly-browser-shard-*
                  path: artifacts/shards
                  merge-multiple: true
            - name: Prove full nightly execution coverage
              run: node scripts/nightly-browser-coverage.js verify --plan=artifacts/nightly-browser-plan.json --report=artifacts/shards/artifacts --output=artifacts/nightly-browser-coverage.json
            - name: Merge reproducible browser report
              if: ${{ always() && !cancelled() }}
              run: npx playwright merge-reports --reporter=html artifacts/shards/blob-report
            - name: Upload combined coverage and HTML report
              if: ${{ always() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: nightly-browser-complete-report
                  path: |
                      artifacts/nightly-browser-coverage.json
                      artifacts/nightly-browser-plan.json
                      playwright-report/
                  if-no-files-found: error
