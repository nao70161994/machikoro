name: Weekly CPU Difficulty Regression

on:
    schedule:
        # Sunday 04:23 JST. Statistical runs are intentionally separate from the PR smoke gate.
        - cron: '23 19 * * 6'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    cpu-difficulty-statistical:
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
              with:
                  node-version: '20'
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Multi-seed paired difficulty regression
              run: npm run test:cpu-difficulty-weekly
            - name: Upload CPU difficulty artifact
              if: ${{ always() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: cpu-difficulty-weekly
                  path: artifacts/cpu-difficulty-weekly.json
                  if-no-files-found: error
