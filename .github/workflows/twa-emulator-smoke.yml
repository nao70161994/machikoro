name: TWA Android Emulator smoke

on:
    workflow_dispatch:
    schedule:
        - cron: '41 18 * * 0'

permissions:
    contents: read

jobs:
    twa-emulator-smoke:
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
              with:
                  node-version: '20'
                  cache: npm

            - uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
              with:
                  java-version: '17'
                  distribution: 'temurin'

            - name: Install Node dependencies
              run: npm ci

            - name: Install Bubblewrap and expect
              run: |
                  npm install -g @bubblewrap/cli@1.24.1
                  sudo apt-get update
                  sudo apt-get install -y expect

            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm

            - name: Build and exercise TWA in Android Emulator
              uses: ReactiveCircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
              with:
                  api-level: 35
                  target: google_apis
                  arch: x86_64
                  profile: pixel_7_pro
                  emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
                  disable-animations: true
                  script: sh scripts/twa-emulator-smoke.sh

            - name: Upload TWA emulator evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: twa-emulator-smoke
                  path: artifacts/twa-emulator/
                  if-no-files-found: warn
                  retention-days: 14
