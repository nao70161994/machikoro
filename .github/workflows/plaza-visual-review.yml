name: Plaza visual review

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    flight-render-profile:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        container:
            image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
            options: --ipc=host --init
        strategy:
            fail-fast: false
            matrix:
                mode: [pc-corrected-all-widths]
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
            - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
              with:
                  node-version: '20'
                  cache: npm
            - run: npm ci
            - run: node scripts/check-playwright-container.js
            - name: Repeat all original construction cases without retries
              run: |
                  xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' npx playwright test cardboard-view.spec.js --grep '実ロール後の新規建設通知' --project=mobile-webkit --workers=1 --repeat-each=3 --retries=0 --output=test-results/flight-repeats
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              if: always()
              with:
                  name: flight-render-${{ matrix.mode }}
                  path: test-results/
                  if-no-files-found: error
