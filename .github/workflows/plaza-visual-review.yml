name: Plaza visual review

on:
    pull_request:
        paths:
            - 'style.css'
            - 'index.html'
            - 'js/ui*.js'
            - 'tests/browser/visual-art-review.spec.js'
            - 'tests/browser/plaza-online.spec.js'
            - '.github/workflows/plaza-visual-review.yml'

permissions:
    contents: read

jobs:
    plaza-webkit:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
              with:
                  node-version: '20'
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps webkit
            - run: npx playwright test visual-art-review.spec.js --grep '広場テーマは共通アート' --retries=0
            - run: npx playwright test plaza-online.spec.js --retries=0
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: always()
              with:
                  name: plaza-visual-review
                  path: test-results/
                  if-no-files-found: warn
