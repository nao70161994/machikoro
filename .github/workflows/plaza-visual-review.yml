name: Portrait density native comparison

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    portrait-density-webkit:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        container:
            image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
            options: --ipc=host --init
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
              with:
                  node-version: '20'
                  cache: npm
            - run: npm ci
            - name: Verify pinned preinstalled browser runtime
              run: node scripts/check-playwright-container.js
            - run: npm run test:types
            - name: Compare measured portrait layouts on native WebKit
              run: npx playwright test cardboard-portrait-density.spec.js --project=mobile-webkit --workers=1 --retries=0 --output=test-results/portrait-density --reporter=line,html
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: always()
              with:
                  name: portrait-density-native-comparison
                  path: |
                      test-results/portrait-density/
                      playwright-report/
                  if-no-files-found: warn
                  retention-days: 14
