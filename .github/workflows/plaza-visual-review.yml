name: Facility image offline and transformed clone review
on:
    workflow_dispatch:
permissions:
    contents: read
jobs:
    quality-candidate:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        container:
            image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
            options: --ipc=host --init
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
            - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
              with:
                  node-version: '20'
                  cache: npm
            - run: npm ci
            - run: node scripts/check-playwright-container.js
            - run: python3 scripts/generate-facility-art-images.py --check
            - name: Check candidate composition roots
              run: npm run test:types
            - name: Native image pixels, rotated clones and offline reload
              if: ${{ !cancelled() }}
              run: npx playwright test facility-image-offline.spec.js --project=mobile-webkit --workers=1 --retries=0 --output=test-results/quality-candidate
            - name: Diagnose the same offline contract in Chromium
              if: ${{ !cancelled() }}
              run: npx playwright test facility-image-offline.spec.js --project=chromium-desktop --workers=1 --retries=0 --output=test-results/quality-candidate-chromium
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              if: always()
              with:
                  name: quality-candidate-native
                  path: |
                      test-results/quality-candidate/
                      test-results/quality-candidate-chromium/
                      playwright-report/
                  if-no-files-found: warn
