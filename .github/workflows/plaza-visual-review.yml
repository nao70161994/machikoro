name: Active card ownership visibility review
on:
    workflow_dispatch:
permissions:
    contents: read
jobs:
    candidate:
        runs-on: ubuntu-latest
        timeout-minutes: 32
        container:
            image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
            options: --ipc=host --init
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: cpu-observer
                      command: npx playwright test cardboard-cpu-results.spec.js --project=mobile-webkit --workers=1 --retries=0
                    - name: owner-names
                      command: npx playwright test cardboard-owner-names.spec.js --project=mobile-webkit --workers=1 --retries=0
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
            - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
              with:
                  node-version: '20'
                  cache: npm
            - run: npm ci
            - run: node scripts/check-playwright-container.js
            - name: Candidate validation
              env:
                  RUN_UI_PLAYTHROUGH: '1'
                  UI_PLAYTHROUGH_WIDTH: '1440'
                  UI_PLAYTHROUGH_PLAYER_COUNT: '2'
                  UI_PLAYTHROUGH_CPU_SPEED: '1500'
                  CARDBOARD_MATCH_PLAYER_COUNT: ${{ matrix.players }}
              run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' ${{ matrix.command }}
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              if: always()
              with:
                  name: economy-candidate-${{ matrix.name }}
                  path: |
                      test-results/
                      tests/browser/theme-visual-regression.spec.js-snapshots/
                  if-no-files-found: error
