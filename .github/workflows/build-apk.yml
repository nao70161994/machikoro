name: TWA APK ビルド

on:
    workflow_dispatch:
        inputs:
            build_signed:
                description: '署名付きAPKもビルドする'
                required: true
                type: boolean
                default: false

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: '20'

            - uses: actions/setup-python@v6
              with:
                  python-version: '3.x'
                  cache: pip
                  cache-dependency-path: scripts/rl/requirements.txt

            - name: 依存関係インストール
              run: |
                  npm ci
                  python -m pip install --upgrade pip
                  pip install -r scripts/rl/requirements.txt

            - name: APK build 前リリースゲート
              run: |
                  npm run test:static
                  npm test
                  npm run test:pwa
                  npm run test:release

            - name: TWA 静的検証
              run: npm run test:apk-validation

            - name: Bubblewrap 1.24.1 検証
              run: |
                  npm install -g @bubblewrap/cli@1.24.1
                  test "$(bubblewrap --version)" = "1.24.1"

    build-signed:
        if: ${{ inputs.build_signed }}
        needs: validate
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            NTFY_CI_TOPIC: ${{ secrets.NTFY_CI_TOPIC }}

        steps:
            - uses: actions/checkout@v6

            - name: 署名Secret存在確認
              env:
                  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
                  KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
                  KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
              run: |
                  missing=""
                  [ -n "$ANDROID_KEYSTORE_BASE64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
                  [ -n "$KEYSTORE_STORE_PASSWORD" ] || missing="$missing KEYSTORE_STORE_PASSWORD"
                  [ -n "$KEYSTORE_KEY_PASSWORD" ] || missing="$missing KEYSTORE_KEY_PASSWORD"
                  if [ -n "$missing" ]; then
                      echo "署名付きAPKに必要なGitHub Actions secretsが未設定です:$missing" >&2
                      exit 1
                  fi

            - uses: actions/setup-java@v5
              with:
                  java-version: '17'
                  distribution: 'temurin'

            - uses: actions/setup-node@v6
              with:
                  node-version: '20'

            - name: Bubblewrap 1.24.1 インストール
              run: |
                  npm install -g @bubblewrap/cli@1.24.1
                  test "$(bubblewrap --version)" = "1.24.1"

            - name: Bubblewrap 設定
              run: |
                  node -e "
                  const os = require('os');
                  const fs = require('fs');
                  const path = require('path');
                  const dir = path.join(os.homedir(), '.bubblewrap');
                  fs.mkdirSync(dir, { recursive: true });
                  fs.writeFileSync(path.join(dir, 'config.json'), JSON.stringify({
                      jdkPath: process.env.JAVA_HOME,
                      androidSdkPath: '/usr/local/lib/android/sdk'
                  }));
                  "

            - name: キーストア復元
              env:
                  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
              run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android.keystore

            - name: SHA256フィンガープリント検証
              env:
                  KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
              run: |
                  FINGERPRINT="$(keytool -list -v -keystore android.keystore -alias android -storepass "$KEYSTORE_STORE_PASSWORD" | sed -n 's/.*SHA256: //p')"
                  if [ -z "$FINGERPRINT" ] || ! grep -q "$FINGERPRINT" server.js; then
                      echo "keystore fingerprint が server.js の assetlinks.json 設定と一致しません" >&2
                      exit 1
                  fi

            - name: twa-manifest.json 作成
              run: node scripts/create-twa-manifest.js --output twa-manifest.json --version-code "${GITHUB_RUN_NUMBER:-1}"

            - name: SDKライセンス事前承認
              run: |
                  mkdir -p /usr/local/lib/android/sdk/tools
                  yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

            - name: APK ビルド（PWA validation有効）
              env:
                  BUBBLEWRAP_SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
                  BUBBLEWRAP_SIGNING_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
              run: |
                  sudo apt-get update
                  sudo apt-get install -y expect
                  expect << 'EXPECTEOF'
                  set timeout 600
                  log_user 1
                  spawn bubblewrap build
                  expect {
                      -re {\(Y/n\)} { send "Y\r"; exp_continue }
                      eof           { }
                  }
                  lassign [wait] pid spawnid os_error_flag value
                  exit $value
                  EXPECTEOF

            - name: APK ファイル確認
              run: test -s app-release-signed.apk

            - name: APK アップロード
              uses: actions/upload-artifact@v7
              with:
                  name: machikoro-apk
                  path: app-release-signed.apk
                  if-no-files-found: error
                  retention-days: 14

            - name: Notify CI failure
              if: ${{ failure() && env.NTFY_CI_TOPIC != '' }}
              continue-on-error: true
              env:
                  FAILED_JOB: build-signed
              run: |
                  RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                  SHORT_COMMIT="${GITHUB_SHA:0:7}"
                  printf 'workflow=%s\nbranch=%s\ncommit=%s\nfailed_job=%s\nrun=%s\n' \
                      "$GITHUB_WORKFLOW" "$GITHUB_REF_NAME" "$SHORT_COMMIT" "$FAILED_JOB" "$RUN_URL" \
                      > /tmp/ntfy-ci-message.txt
                  curl -fsS -X POST "https://ntfy.sh/${NTFY_CI_TOPIC}" \
                      -H "Title: [ダイスシティ CI] ${GITHUB_WORKFLOW} failed" \
                      -H "Priority: 4" \
                      -H "Tags: warning,github_actions" \
                      --data-binary @/tmp/ntfy-ci-message.txt
