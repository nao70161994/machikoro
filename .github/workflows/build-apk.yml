name: TWA APK ビルド

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 依存関係インストール
        run: npm ci

      - name: APK build 前リリースゲート
        run: |
          npm run test:static
          npm test
          npm run test:pwa
          npm run test:release

      - name: Bubblewrap インストール
        run: npm install -g @bubblewrap/cli

      - name: Bubblewrap 設定（Node.jsで確実に書き込む）
        run: |
          node -e "
          const os = require('os');
          const fs = require('fs');
          const path = require('path');
          const dir = path.join(os.homedir(), '.bubblewrap');
          fs.mkdirSync(dir, { recursive: true });
          const config = {
            jdkPath: process.env.JAVA_HOME,
            androidSdkPath: '/usr/local/lib/android/sdk'
          };
          const configPath = path.join(dir, 'config.json');
          fs.writeFileSync(configPath, JSON.stringify(config));
          console.log('Written to:', configPath);
          console.log('Content:', fs.readFileSync(configPath, 'utf8'));
          console.log('JDK exists:', fs.existsSync(config.jdkPath));
          console.log('SDK exists:', fs.existsSync(config.androidSdkPath));
          console.log('build-tools exists:', fs.existsSync(path.join(config.androidSdkPath, 'build-tools')));
          "

      - name: キーストア生成（またはSecretから復元）
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "release APK には assetlinks.json と一致する ANDROID_KEYSTORE_BASE64 が必要です" >&2
            exit 1
          fi
          if [ -z "$KEYSTORE_STORE_PASSWORD" ] || [ -z "$KEYSTORE_KEY_PASSWORD" ]; then
            echo "ANDROID_KEYSTORE_BASE64 を使う場合は KEYSTORE_STORE_PASSWORD と KEYSTORE_KEY_PASSWORD が必要です" >&2
            exit 1
          fi
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            STORE_PASSWORD="$KEYSTORE_STORE_PASSWORD"
            KEY_PASSWORD="$KEYSTORE_KEY_PASSWORD"
            echo "=== Secretからキーストアを復元 ==="
            printf "%s" "$ANDROID_KEYSTORE_BASE64" | base64 -d > android.keystore
          fi

      - name: SHA256フィンガープリント出力
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_STORE_PASSWORD" ]; then
            echo "KEYSTORE_STORE_PASSWORD が必要です" >&2
            exit 1
          fi
          STORE_PASSWORD="$KEYSTORE_STORE_PASSWORD"
          echo "=== SHA256フィンガープリント（assetlinks.json用） ==="
          FINGERPRINT="$(keytool -list -v \
            -keystore android.keystore \
            -alias android \
            -storepass "$STORE_PASSWORD" \
            | sed -n 's/.*SHA256: //p')"
          if [ -z "$FINGERPRINT" ]; then
            echo "keystore fingerprint を取得できませんでした" >&2
            exit 1
          fi
          echo "SHA256: $FINGERPRINT"
          if ! grep -q "$FINGERPRINT" server.js; then
            echo "keystore fingerprint が server.js の assetlinks.json 設定と一致しません" >&2
            exit 1
          fi

      - name: twa-manifest.json 作成
        run: |
          APP_VERSION_CODE="${GITHUB_RUN_NUMBER:-1}"
          cat > twa-manifest.json << EOF_MANIFEST
          {
            "packageId": "com.machikoro.game",
            "host": "machikoro-9jv2.onrender.com",
            "name": "街コロ",
            "launcherName": "街コロ",
            "display": "standalone",
            "orientation": "portrait",
            "themeColor": "#0f0e17",
            "backgroundColor": "#0f0e17",
            "startUrl": "/",
            "iconUrl": "https://machikoro-9jv2.onrender.com/icons/icon-512.png",
            "maskableIconUrl": "https://machikoro-9jv2.onrender.com/icons/icon-512.png",
            "monochromeIconUrl": "https://machikoro-9jv2.onrender.com/icons/icon-512.png",
            "appVersion": "${APP_VERSION_CODE}",
            "appVersionCode": ${APP_VERSION_CODE},
            "signingKey": {
              "path": "android.keystore",
              "alias": "android"
            },
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://machikoro-9jv2.onrender.com/manifest.json",
            "sdkVersion": "36",
            "minSdkVersion": "21",
            "isChromeOSOnly": false,
            "enableNotifications": false,
            "features": {},
            "alphaDependencies": { "enabled": false },
            "enableSiteSettingsShortcut": true,
            "metaQuest": { "enabled": false },
            "splashScreenFadeOutDuration": 300
          }
          EOF_MANIFEST

      - name: SDK tools ディレクトリ作成・ライセンス事前承認
        run: |
          mkdir -p /usr/local/lib/android/sdk/tools
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: APK ビルド
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          BUBBLEWRAP_SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          BUBBLEWRAP_SIGNING_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$BUBBLEWRAP_SIGNING_STORE_PASSWORD" ] || [ -z "$BUBBLEWRAP_SIGNING_KEY_PASSWORD" ]; then
            echo "release APK には ANDROID_KEYSTORE_BASE64 / KEYSTORE_STORE_PASSWORD / KEYSTORE_KEY_PASSWORD が必要です" >&2
            exit 1
          fi
          export BUBBLEWRAP_SIGNING_STORE_PASSWORD
          export BUBBLEWRAP_SIGNING_KEY_PASSWORD
          which expect || sudo apt-get install -y expect
          expect << 'EXPECTEOF'
          set timeout 600
          log_user 1
          spawn bubblewrap build --skipPwaValidation
          expect {
            -re {\(Y/n\)} { send "Y\r"; exp_continue }
            eof           { }
          }
          lassign [wait] pid spawnid os_error_flag value
          exit $value
          EXPECTEOF

      - name: APK ファイル確認
        run: |
          echo "=== カレントディレクトリ ==="
          ls -la
          echo "=== APK検索（全体） ==="
          find /home/runner -name "*.apk" 2>/dev/null | head -20 || echo "not found"
          test -s app-release-signed.apk

      - name: APK アップロード
        uses: actions/upload-artifact@v4
        with:
          name: machikoro-apk
          path: app-release-signed.apk
          if-no-files-found: error
          retention-days: 14
