name: RL Natural Candidates - Peer Head-to-Head
on:
  push:
    branches: [run/rl-natural-candidate-comparison-20261102]
    paths: ['.github/workflows/rl-natural-peer-match-20261104.yml']
permissions:
  contents: read
  actions: read

jobs:
  peer:
    name: compare ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: 2p-seed73-vs-seed76, players: 2, a: 'natural-2p-seed73-41281719490', a_checkpoint: 'best_model.top3.browser.json', b: 'natural-2p-seed76-41281719490', b_checkpoint: 'best_model.top2.browser.json'}
          - {name: 4p-seed104-vs-seed106, players: 4, a: 'natural-4p-seed104-41281719490', a_checkpoint: 'best_model.browser.json', b: 'natural-4p-seed106-41281719490', b_checkpoint: 'best_model.browser.json'}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Retrieve candidate A
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.a }}
          run-id: '41281719490'
          github-token: ${{ github.token }}
          path: artifacts/natural-peer/a
      - name: Retrieve candidate B
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.b }}
          run-id: '41281719490'
          github-token: ${{ github.token }}
          path: artifacts/natural-peer/b
      - name: Evaluate strongest models directly with balanced seats
        shell: bash
        run: |
          set -euo pipefail
          a="artifacts/natural-peer/a/${{ matrix.a_checkpoint }}"
          b="artifacts/natural-peer/b/${{ matrix.b_checkpoint }}"
          out="artifacts/natural-peer/results/${{ matrix.name }}"
          mkdir -p "$out"
          test -s "$a" && test -s "$b"
          if [[ ${{ matrix.players }} == 2 ]]; then
            node scripts/eval-rl-head-to-head.js \
              --candidate "$a" --baseline "$b" \
              --games 400 --seed 20261221 --max-steps 1500 \
              --format json --output "$out/peer-direct.json" --progress-every 100
          else
            node scripts/eval-rl-head-to-head.js \
              --candidate "$a" --baseline "$b" \
              --games 200 --seed 20261221 --max-steps 1500 \
              --lineups 'candidate,baseline,normal,strong;candidate,baseline,normal,normal;candidate,baseline,weak,normal' \
              --format json --output "$out/peer-direct.json" --progress-every 50
          fi
      - name: Preserve peer comparison
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rl-natural-peer-${{ matrix.name }}-${{ github.run_id }}
          path: artifacts/natural-peer/results/${{ matrix.name }}/
          retention-days: 30
          if-no-files-found: warn
