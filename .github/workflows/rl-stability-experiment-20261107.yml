name: RL Value Collapse - matched-seed learning stability experiment
on:
  push:
    branches: [feature/rl-portfolio-next-phase-20261107]
    paths: ['.github/workflows/rl-stability-experiment-20261107.yml']
permissions:
  contents: read
  actions: read
jobs:
  train:
    name: seed ${{ matrix.seed }} - ${{ matrix.kind }}
    runs-on: ubuntu-latest
    timeout-minutes: 270
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {seed: 81, kind: "reference", rate: '0.00002', epsilon: '0.20'}
          - {seed: 81, kind: "half-lr", rate: '0.00001', epsilon: '0.20'}
          - {seed: 81, kind: "quarter-lr", rate: '0.000005', epsilon: '0.20'}
          - {seed: 81, kind: "low-epsilon", rate: '0.00002', epsilon: '0.05'}
          - {seed: 82, kind: "reference", rate: '0.00002', epsilon: '0.20'}
          - {seed: 82, kind: "half-lr", rate: '0.00001', epsilon: '0.20'}
          - {seed: 82, kind: "quarter-lr", rate: '0.000005', epsilon: '0.20'}
          - {seed: 82, kind: "low-epsilon", rate: '0.00002', epsilon: '0.05'}
    env:
      TRAIN_SEED: ${{ matrix.seed }}
      KIND: ${{ matrix.kind }}
      RATE: ${{ matrix.rate }}
      EPSILON: ${{ matrix.epsilon }}
      LABEL: stability-seed${{ matrix.seed }}-${{ matrix.kind }}-${{ github.run_id }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with: {node-version: '20', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/rl/requirements-ci.txt
      - run: |
          npm ci
          python -m pip install -r scripts/rl/requirements-ci.txt
      - name: Train independent actor critic with controlled epsilon and learning rate
        shell: bash
        run: |
          set -euo pipefail
          dir="models/rl_model/runs/$LABEL"
          mkdir -p "$dir"
          printf 'seed=%s\nvariant=%s\nlearning_rate=%s\ninitial_epsilon=%s\ngames=1800\nplayers=2\nreward=terminal-shaped-rewardcap\n' "$TRAIN_SEED" "$KIND" "$RATE" "$EPSILON" > "$dir/experiment.txt"
          timeout --signal=TERM --kill-after=45s 200m \
            sh scripts/rl/run-self-only-h256-lr2e5-5000.sh \
              --run-label "$LABEL" --seed "$TRAIN_SEED" --games 1800 \
              --lr "$RATE" --epsilon "$EPSILON" \
              --hidden 256 --train-opponents self=1 --self-learn-both-sides \
              --eval-every 200 --checkpoint-every 50 --progress-every 50 \
              --best-checkpoint-top-k 3 --restore-best-at-end \
              --js-eval-games 4 --initial-eval-games 0 \
              --eval-random-games 4 --eval-heuristic-games 2 --eval-pool-games 0 \
              --final-eval-random-games 8 --final-eval-heuristic-games 4 --final-eval-pool-games 0 \
              --pool-update-every 0 --max-steps 1200 --eval-max-steps 1200 \
              > "$dir/train.log" 2>&1
          tail -n 12 "$dir/train.log"
      - name: Validate early best checkpoint versus late weights on unused seeds
        shell: bash
        run: |
          set -euo pipefail
          dir="models/rl_model/runs/$LABEL"
          test -s "$dir/best_model.browser.json"
          test -s "$dir/model.progress.browser.json"
          node scripts/eval-rl-head-to-head.js \
            --candidate "$dir/best_model.browser.json" \
            --baseline "$dir/model.progress.browser.json" \
            --games 120 --seed 20261107 --max-steps 1500 \
            --format json --output "$dir/best-vs-last.json" \
            --bootstrap-iterations 250 --abort-on-exhaustion
          node scripts/eval-rl-models.js \
            --model-paths "$dir/best_model.browser.json,$dir/model.progress.browser.json" \
            --games 100 --seed 20261117 --max-steps 1500 \
            --paired-seats --opponents weak,normal,strong \
            --format json --output "$dir/heldout-evaluation.json"
      - name: Preserve model checkpoints and loss curves for collapse diagnosis
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rl-stability-seed${{ matrix.seed }}-${{ matrix.kind }}-${{ github.run_id }}
          path: |
            models/rl_model/runs/stability-seed${{ matrix.seed }}-${{ matrix.kind }}-${{ github.run_id }}/experiment.txt
            models/rl_model/runs/stability-seed${{ matrix.seed }}-${{ matrix.kind }}-${{ github.run_id }}/train.log
            models/rl_model/runs/stability-seed${{ matrix.seed }}-${{ matrix.kind }}-${{ github.run_id }}/train_metrics.csv
            models/rl_model/runs/stability-seed${{ matrix.seed }}-${{ matrix.kind }}-${{ github.run_id }}/summary.json
            models/rl_model/runs/stability-seed${{ matrix.seed }}-${{ matrix.kind }}-${{ github.run_id }}/best_model*.browser.json
            models/rl_model/runs/stability-seed${{ matrix.seed }}-${{ matrix.kind }}-${{ github.run_id }}/model.progress.browser.json
            models/rl_model/runs/stability-seed${{ matrix.seed }}-${{ matrix.kind }}-${{ github.run_id }}/best-vs-last.json
            models/rl_model/runs/stability-seed${{ matrix.seed }}-${{ matrix.kind }}-${{ github.run_id }}/heldout-evaluation.json
          retention-days: 30
          if-no-files-found: warn
