name: RL PR23 Targeted Revalidation
on:
  push:
    branches: [verify/rl-portfolio-pr23-final-20261107]
    paths: ['.github/workflows/rl-pr23-targeted-revalidation.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with: {node-version: '20', cache: npm}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/rl/requirements-ci.txt
      - run: |
          npm ci
          python -m pip install -r scripts/rl/requirements-ci.txt
      - name: Run affected UI and RL test suites
        run: |
          node tests/main.test.js
          node tests/online.test.js
          node tests/local-player-settings.test.js
          node tests/online-player-settings.test.js
          node tests/report-rl-league.test.js
      - name: Run full release test gate
        run: npm run test:release
