<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>にぎわい広場・公式実画面との比較レビュー</title>
    <style>
        body { margin: 0; padding: 20px; color: #e9eeee; background: #172525; font: 16px/1.6 sans-serif; }
        h1 { margin: 0 0 12px; font-size: 22px; }
        a { color: #a8e8ff; }
        label { display: inline-flex; gap: 8px; align-items: center; margin: 0 16px 16px 0; }
        select { padding: 8px; font: inherit; }
        main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
        figure { margin: 0; padding: 12px; background: #233838; }
        img { display: block; width: 100%; height: 66vh; object-fit: contain; object-position: top; background: #102020; }
        figcaption { padding-top: 10px; }
        .note { max-width: 1000px; font-size: 14px; }
        @media (max-width: 800px) { main { grid-template-columns: 1fr; } img { height: auto; max-height: 80vh; } }
    </style>
</head>
<body>
    <h1>公式実画面とにぎわい広場を並べて比較</h1>
    <label>画面幅
        <select id="width"><option>320</option><option>390</option><option>844</option><option selected>1440</option></select>
    </label>
    <label>状態
        <select id="stage">
            <option value="price">序盤</option><option value="grown">成長した盤面</option>
            <option value="late" selected>終盤の全体図</option><option value="late-readable">終盤の拡大</option>
        </select>
    </label>
    <main>
        <figure>
            <img src="https://assets.topics.apps-jp.nintendo.com/image/2024/07/02035144057922/1280/01.jpg" alt="任天堂公式記事掲載のみんなと街コロの実プレイ画面">
            <figcaption>みんなと街コロ：任天堂公式記事の1280×720実画面。<a href="https://www.nintendo.com/jp/topics/article/1408afb9-9061-4c0c-8a6a-816b5caeccde">出典</a>。画像は公式配信先から読み込み、アプリには同梱しない。</figcaption>
        </figure>
        <figure>
            <img id="ours" src="1440-late.png" alt="ダイスシティの終盤全体図">
            <figcaption id="caption">ダイスシティ：1440px、終盤の全体図（固定状態のブラウザ撮影）。</figcaption>
        </figure>
    </main>
    <p class="note">製品コード3b6d2353。比較観点：所有カードと市場の存在感、アート・色・出目・枚数、HUDの占有、誰の場か、空白、操作の分かりやすさ。解像度・画面比・撮影状態が異なるため、同一倍率・同一対局の比較ではない。静止画だけで演出時間、音、商用品質の完全な同等性を証明しない。</p>
    <p><a href="natural-844-midgame.png">最新版の自然UI対局の中盤</a> ／ <a href="natural-844-late-game.png">最新版の自然UI対局の終盤</a> ／ <a href="../2026-10-16-card-table-readability/844-activation-live.png">出目確定と施設発動</a> ／ <a href="../2026-10-16-card-table-readability/seeded-match-4p-cardboard-desktop-late.png">旧fe版4人CPU対局の終盤</a> ／ <a href="../../CARD-TABLE-READABILITY-AUDIT.md">監査・限界</a></p>
    <script>
        const width = document.getElementById('width');
        const stage = document.getElementById('stage');
        function update() {
            document.getElementById('ours').src = `${width.value}-${stage.value}.png`;
            document.getElementById('ours').alt = `ダイスシティ ${width.value}px ${stage.selectedOptions[0].textContent}`;
            document.getElementById('caption').textContent = `ダイスシティ：${width.value}px、${stage.selectedOptions[0].textContent}（固定状態のブラウザ撮影）。`;
        }
        width.addEventListener('change', update);
        stage.addEventListener('change', update);
    </script>
</body>
</html>
